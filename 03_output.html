<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="06_output.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <title>Output Panel</title>
</head>
<body>
    <div class="outputbox">
        
        <div class="top">
            <div class="heading">TOP Priority REGION</div>
            <div id="topRegion"></div>
        </div>
        <div class="aibox">
            <div class="heading">AI Recommendation</div>
            <div id="aiRecommendation"></div>
            <div id="prioritySummary"></div>
        </div>
        
        <div class="heading">  
            Resource Priority Graph
        </div>
        <div class="zonebox"></div>
        <div class="allocationtable">
            <table>
                <tr>
                    <th>Region</th>
                    <th>Budget %</th>
                    <th>Food</th>
                    <th>Water</th>
                    <th>Medical</th>
                    <th>Shelter</th>
                </tr>
            </table>
        </div>
        <div class="heading summary">Resource Summary</div>
        <div class="resourcecardbox">
            <div class="minicard">
                <div class="text">🍱</div>
                <value class="totalfoodbudget"></value>
                <label>Sustain Population</label>
            </div>
            <div class="minicard">
                <div class="text">🛖</div>
                <value class="totalshelterbudget"></value>
                <label>Protection</label>
            </div>
            <div class="minicard">
                <div class="text">🚰</div>
                <value class="totalwaterbudget"></value>
                <label>survival & Hygiene</label>
            </div>
            <div class="minicard">
                <div class="text">🏥</div>
                <value class="totalmedicalbudget"></value>
                <label>Emergency Care</label>
            </div>
        </div>
        <div class="btnbox">
            <button class="btn" onclick="goBack()">Back</button>
            <button class="btn" onclick="goHome()">Home</button>
        </div>
    </div> 
    <div id="map"></div>

    <script src="08_output.js"></script>
</body>
</html>
